<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shaxnoz Shirinliklari</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf2f5;--card:#fff;--ink:#3b1f3a;--mute:#7d6279;--pink:#e2557f;--pist:#9cc185;--line:#f0d9e1;--yel:#f7c948;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1f1221;--card:#2c1a2e;--ink:#f8e9f0;--mute:#c0a3bb;--pink:#f0698f;--line:#44284a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 100px}
header,main{max-width:720px;margin:0 auto;padding:16px}
h1,h2{font-family:'Bagel Fat One','Nunito',sans-serif;font-weight:400;color:var(--pink);margin:0}
h1{font-size:clamp(2rem,9vw,3.2rem);line-height:1.05;cursor:pointer;user-select:none}
header p{margin:8px 0 0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pic{height:96px;border-radius:12px;display:grid;place-items:center;font-size:2.4rem;background:var(--pist) center/cover}
.item h3{margin:0;font-size:1rem}.item small{color:var(--mute)}.price{font-weight:800}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
button{font:inherit;cursor:pointer}
.add,.pm,.pri{border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:800}
.add{padding:8px 14px;width:100%}.pm{width:36px;height:36px;font-size:1.2rem}.pri{padding:10px 16px}
.sec{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar button{display:block;width:100%;max-width:720px;margin:0 auto;border:0;border-radius:14px;padding:14px;background:var(--pink);color:#fff;font-weight:800}
.bar button:disabled{opacity:.45}
dialog{border:0;border-radius:20px;padding:20px;width:min(94vw,460px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,10,30,.55)}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
label{display:block;margin-top:12px;font-weight:600;font-size:.9rem}
input,textarea,select{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}
.err{color:var(--pink);font-size:.85rem;min-height:1.2em;margin:8px 0 0}
.acts{display:flex;gap:8px;margin-top:12px}.acts>*{flex:1}
:focus-visible{outline:3px solid var(--pist);outline-offset:2px}
#adm{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;z-index:5}
#adm .w{max-width:720px;margin:0 auto}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs .on{background:var(--pink);color:#fff;border-color:var(--pink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.pr{display:flex;gap:10px;align-items:center}.pr .pic{width:56px;height:56px;font-size:1.6rem;flex:none}.pr>div:nth-child(2){flex:1}
.st{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--pist);color:#1d2b14;font-size:.8rem;font-weight:800}
#ab{position:fixed;right:14px;bottom:84px;z-index:4;border:0;border-radius:99px;padding:10px 16px;background:var(--ink);color:var(--bg);font-weight:800}
[hidden]{display:none!important}
.hero{display:flex;align-items:center;gap:8px;background:var(--pink);color:#fff;border-radius:22px;padding:18px;margin:4px 0 8px}
.hero h2{color:#fff;font-size:1.4rem;line-height:1.15}.hero span{font-size:3.4rem}
.sh{margin:18px 0 8px;font-size:1.1rem}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.hs .item{min-width:160px;flex:none}
.chips,.seg{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--yel);border-color:var(--yel);color:#2a1a24}
.yel{border:0;border-radius:14px;padding:12px 18px;background:var(--yel);color:#2a1a24;font-weight:800}.big{width:100%;padding:14px;margin-top:6px}
.bdg{position:absolute;top:6px;left:6px;background:var(--pink);color:#fff;border-radius:99px;padding:1px 8px;font-size:.75rem;font-weight:800}
.item>div:first-child{position:relative}.pp{display:flex;gap:6px;align-items:baseline}.pp s{color:var(--mute);font-size:.85rem}
input[type=search]{border-radius:99px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;position:relative;border:0;background:none;color:var(--mute);padding:10px 4px;font-size:1.3rem;display:flex;flex-direction:column;align-items:center}
#nav button span{font-size:.72rem;font-weight:700}#nav button.on{color:var(--pink)}
#cb{position:absolute;top:4px;left:55%;background:var(--pink);color:#fff;border-radius:99px;font:800 .7rem/1 Nunito,sans-serif;padding:3px 6px}
.empty{text-align:center;padding:40px 0}.dp{height:200px;font-size:4rem}
#toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:9;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700}
.stepper{display:flex;align-items:center;gap:14px}
</style>
</head>
<body>
<header><h1 id="logo">Shaxnoz Shirinliklari</h1></header>
<main id="view"></main>
<nav id="nav"><button data-tab="home">🏠<span>Asosiy</span></button><button data-tab="cart">🛒<span>Savat</span><i id="cb" hidden></i></button><button data-tab="orders">📦<span>Buyurtmalarim</span></button></nav>
<button id="ab" hidden>Admin</button>
<dialog id="det"></dialog>
<div id="toast" role="status" hidden></div>

<dialog id="login">
  <h2>Admin kirishi</h2>
  <label>Email<input id="em" type="email" autocomplete="username"></label>
  <label>Parol<input id="pw" type="password" autocomplete="current-password"></label>
  <p class="err" id="lerr" role="alert"></p>
  <div class="acts"><button class="sec" id="lc" type="button">Bekor qilish</button><button class="pri" id="lg" type="button">Kirish</button></div>
</dialog>

<section id="adm" hidden><div class="w">
  <div class="pr"><h2 style="flex:1">Admin panel</h2><button class="sec" id="aclose">Do'konga qaytish</button><button class="sec" id="aout">Chiqish</button></div>
  <div class="tabs"><button class="sec on" data-t="p">Mahsulotlar</button><button class="sec" data-t="o" id="otab">Buyurtmalar</button></div>
  <div id="tp">
    <div class="card"><b id="ftitle">Yangi mahsulot</b>
      <label>Nomi<input id="pn" maxlength="60"></label>
      <label>Tavsif (masalan: Asalli, 500 g)<input id="pi" maxlength="80"></label>
      <label>Narxi (so'm)<input id="pp" type="number" inputmode="numeric" min="0"></label>
      <label>Eski narx (aksiya uchun, bo'sh qoldirish mumkin)<input id="po" type="number" inputmode="numeric" min="0"></label>
      <label>Kategoriya (masalan: Tortlar)<input id="pk" list="kl" maxlength="40"></label><datalist id="kl"></datalist>
      <label>Tavsif<textarea id="pd" rows="2" maxlength="300"></textarea></label>
      <label>Rasm<input id="pf" type="file" accept="image/*"></label>
      <label><input id="pa" type="checkbox" checked>Sotuvda bor</label>
      <p class="err" id="perr"></p>
      <div class="acts"><button class="sec" id="pc" type="button">Tozalash</button><button class="pri" id="ps" type="button">Saqlash</button></div>
    </div>
    <div id="plist"></div>
  </div>
  <div id="to" hidden><div id="olist"></div></div>
</div></section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,deleteDoc,updateDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyAvnFrDkdK_Zov7EfxP8VDzyUr4K3aDrNU",authDomain:"shaxnoz-shirinliklari-a9c57.firebaseapp.com",projectId:"shaxnoz-shirinliklari-a9c57",storageBucket:"shaxnoz-shirinliklari-a9c57.firebasestorage.app",messagingSenderId:"516006438707",appId:"1:516006438707:web:8cadb015038d9f968f8046"});
const auth=getAuth(app),db=getFirestore(app);
const ADMIN="O6dI6NK2rSTGEwPHzjdXxZpyrlg1",TG="im_gulomov";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const som=n=>Number(n||0).toLocaleString("ru-RU")+" so'm";
const ST={new:"Yangi",cooking:"Tayyorlanmoqda",done:"Yetkazildi",cancel:"Bekor qilindi"};
let products=[],orders=[],cart={},isAdmin=false,editId=null,editImg="",unsubO=null;

const pic=p=>`<div class="pic" ${p.img?`style="background-image:url('${esc(p.img)}')"`:""}>${p.img?"":"🍬"}</div>`;
const total=()=>products.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);
const count=()=>products.reduce((s,p)=>s+(cart[p.id]||0),0);

const lsg=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let tab="home",cat="Hammasi",qs="",method="delivery",dq=1,detId=null,myIds=[];
try{myIds=JSON.parse(lsg("myOrders")||"[]")}catch(e){}
const F={name:lsg("fn"),phone:lsg("fp"),addr:lsg("fa"),note:""},myMap={},subs={},SV={name:"fn",phone:"fp",addr:"fa"};
const avail=()=>products.filter(p=>p.available!==false);
const disc=p=>p.old>p.price?Math.round(100-p.price/p.old*100):0;
const toast=m=>{const t=$("toast");t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,4000)};
function watch(id){if(subs[id])return;subs[id]=onSnapshot(doc(db,"orders",id),s=>{myMap[id]=s.exists()?s.data():null;if(tab==="orders")render()},()=>{})}
myIds.forEach(watch);
onSnapshot(collection(db,"products"),s=>{
  products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  Object.keys(cart).forEach(k=>{if(!products.find(p=>p.id===k&&p.available!==false))delete cart[k]});
  render();plist();
});
const stepper=(id,q)=>`<div class="step"><button class="pm" data-d="-1" data-id="${id}" aria-label="Kamaytirish">−</button><b>${q}</b><button class="pm" data-d="1" data-id="${id}" aria-label="Ko'paytirish">+</button></div>`;
const card=p=>{const q=cart[p.id]||0,d=disc(p);
  return `<div class="item"><div data-open="${p.id}" style="cursor:pointer">${pic(p)}${d?`<span class="bdg">-${d}%</span>`:""}<h3>${esc(p.name)}</h3><small>${esc(p.info)}</small></div><div class="pp"><span class="price">${som(p.price)}</span>${d?`<s>${som(p.old)}</s>`:""}</div>${q?stepper(p.id,q):`<button class="add" data-d="1" data-id="${p.id}">Qo'shish</button>`}</div>`};
const list=()=>avail().filter(p=>(cat==="Hammasi"||p.cat===cat)&&(!qs||((p.name||"")+" "+(p.info||"")).toLowerCase().includes(qs.toLowerCase())));
function fillGrid(){const l=list();$("gl").innerHTML=l.map(card).join("");$("gm").textContent=l.length?"":"Hech narsa topilmadi.";}
function home(){
  const promo=avail().filter(p=>disc(p)>0),cats=["Hammasi",...new Set(avail().map(p=>p.cat).filter(Boolean))];
  return `<div class="hero"><div><h2>Qo'lda tayyorlangan shirinliklar</h2><p>Tanlang, buyurtma bering, biz yetkazamiz.</p></div><span aria-hidden="true">🍰</span></div>
  ${promo.length?`<h3 class="sh">Aksiyalar</h3><div class="hs">${promo.map(card).join("")}</div>`:""}
  <h3 class="sh">Katalog</h3><input id="qs" type="search" placeholder="Shirinlik qidirish" value="${esc(qs)}">
  <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="grid" id="gl"></div><p id="gm"></p>`}
function cartV(){
  const ls=avail().filter(p=>cart[p.id]);
  if(!ls.length)return `<div class="empty"><div style="font-size:3rem">🛒</div><p>Savat bo'sh</p><button class="yel" data-tab="home">Katalogga o'tish</button></div>`;
  return `<h3 class="sh">Savat</h3>${ls.map(p=>`<div class="card pr">${pic(p)}<div><b>${esc(p.name)}</b><br><small>${som(p.price)}</small></div>${stepper(p.id,cart[p.id])}</div>`).join("")}
  <h3 class="sh">Qabul qilish usuli</h3><div class="seg"><button class="chip ${method==="delivery"?"on":""}" data-m="delivery">Yetkazib berish</button><button class="chip ${method==="pickup"?"on":""}" data-m="pickup">Olib ketish</button></div>
  <label>Ismingiz<input data-f="name" value="${esc(F.name)}" autocomplete="name" maxlength="80"></label>
  <label>Telefon raqamingiz<input data-f="phone" type="tel" value="${esc(F.phone)}" placeholder="+998 90 123 45 67" autocomplete="tel" maxlength="25"></label>
  ${method==="delivery"?`<label>Manzil<input data-f="addr" value="${esc(F.addr)}" autocomplete="street-address" maxlength="200"></label>`:""}
  <label>Izoh<textarea data-f="note" rows="2" maxlength="300">${esc(F.note)}</textarea></label>
  <div class="card"><div class="row"><span>Mahsulotlar</span><span>${som(total())}</span></div><div class="row"><span>Yetkazib berish</span><span>Kelishiladi</span></div><div class="row"><b>Jami</b><b>${som(total())}</b></div></div>
  <p class="err" id="err" role="alert"></p><button class="yel big" id="send">Buyurtma berish</button>`}
function ordersV(){
  if(!myIds.length)return `<div class="empty"><div style="font-size:3rem">📦</div><p>Hali buyurtma bermagansiz.</p><button class="yel" data-tab="home">Katalogga o'tish</button></div>`;
  const h=[...myIds].reverse().map(id=>{const o=myMap[id];if(!o)return "";
    return `<div class="card"><div class="row"><b>${o.createdAt?o.createdAt.toDate().toLocaleString("ru-RU"):"Yuborilmoqda..."}</b><span class="st">${ST[o.status]||esc(o.status)}</span></div>${(o.items||[]).map(i=>`<div class="row"><span>${esc(i.n)} × ${esc(i.q)}</span><span>${som(i.p*i.q)}</span></div>`).join("")}<div class="row"><b>Jami</b><b>${som(o.total)}</b></div><small>${o.method==="pickup"?"Olib ketish":"Yetkazib berish"}</small></div>`}).join("");
  return `<h3 class="sh">Buyurtmalarim</h3>${h||"<p>Yuklanmoqda...</p>"}`}
function render(){
  $("view").innerHTML=tab==="home"?home():tab==="cart"?cartV():ordersV();
  if(tab==="home")fillGrid();
  const n=count();$("cb").textContent=n||"";$("cb").hidden=!n;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const kl=$("kl");if(kl)kl.innerHTML=[...new Set(products.map(p=>p.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
}
function openDet(id){if(!products.find(x=>x.id===id))return;detId=id;dq=1;drawDet();$("det").showModal()}
function drawDet(){const p=products.find(x=>x.id===detId);if(!p)return;const d=disc(p);
  $("det").innerHTML=`${pic(p).replace('class="pic"','class="pic dp"')}<h2 style="margin-top:12px">${esc(p.name)}</h2><small>${esc(p.info)}</small>${p.desc?`<p>${esc(p.desc)}</p>`:""}<div class="pp"><span class="price">${som(p.price)}</span>${d?`<s>${som(p.old)}</s>`:""}</div>
  <div class="row" style="align-items:center"><b>Miqdori</b><div class="stepper"><button class="pm" data-q="-1" aria-label="Kamaytirish">−</button><b>${dq}</b><button class="pm" data-q="1" aria-label="Ko'paytirish">+</button></div></div>
  <div class="acts"><button class="sec" data-close="1">Yopish</button><button class="yel" data-a="1">Savatga qo'shish · ${som(p.price*dq)}</button></div>`}
$("det").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.q){dq=Math.max(1,dq+ +b.dataset.q);drawDet()}
  else if(b.dataset.a){cart[detId]=(cart[detId]||0)+dq;$("det").close();render()}
  else if(b.dataset.close)$("det").close()};
$("view").onclick=e=>{let b;
  if(b=e.target.closest("[data-id]")){const id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+ +b.dataset.d);if(!cart[id])delete cart[id];render()}
  else if(b=e.target.closest("[data-open]"))openDet(b.dataset.open);
  else if(b=e.target.closest("[data-cat]")){cat=b.dataset.cat;render()}
  else if(b=e.target.closest("[data-m]")){method=b.dataset.m;render()}
  else if(b=e.target.closest("[data-tab]")){tab=b.dataset.tab;render()}
  else if(e.target.id==="send")send()};
$("view").oninput=e=>{const t=e.target;
  if(t.id==="qs"){qs=t.value;fillGrid()}
  else if(t.dataset.f){F[t.dataset.f]=t.value;SV[t.dataset.f]&&lss(SV[t.dataset.f],t.value)}};
$("nav").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;scrollTo(0,0);render()}};
async function send(){
  const name=F.name.trim(),phone=F.phone.trim(),addr=F.addr.trim();
  if(!name||phone.replace(/\D/g,"").length<9||(method==="delivery"&&!addr)){$("err").textContent="Ism, telefon va (yetkazib berish uchun) manzilni to'liq kiriting.";return}
  const items=avail().filter(p=>cart[p.id]).map(p=>({n:p.name,q:cart[p.id],p:p.price}));if(!items.length)return;
  $("send").disabled=true;
  try{
    const r=await addDoc(collection(db,"orders"),{name,phone,addr:method==="delivery"?addr:"",note:F.note.trim(),method,items,total:total(),status:"new",createdAt:serverTimestamp()});
    myIds.push(r.id);lss("myOrders",JSON.stringify(myIds.slice(-30)));watch(r.id);
    cart={};F.note="";tab="orders";scrollTo(0,0);render();toast("Buyurtmangiz qabul qilindi! Tez orada bog'lanamiz.");
  }catch(e){$("err").textContent="Buyurtma yuborilmadi. Internetni tekshirib, qayta urinib ko'ring.";$("send").disabled=false}
}

/* admin kirish: logotipni 5 marta bosing */
let taps=0,tt;
$("logo").onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,2000);if(taps>=5){taps=0;isAdmin?openAdm():($("lerr").textContent="",$("login").showModal())}};
$("lc").onclick=()=>$("login").close();
$("lg").onclick=async()=>{
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);$("pw").value="";}
  catch(e){$("lerr").textContent="Email yoki parol noto'g'ri."}
};
onAuthStateChanged(auth,u=>{
  if(u&&u.uid===ADMIN){isAdmin=true;$("login").close();$("ab").hidden=false;openAdm();
    unsubO=onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc")),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));olist()})}
  else{if(u){signOut(auth);$("lerr").textContent="Bu akkaunt admin emas.";}
    isAdmin=false;$("ab").hidden=true;$("adm").hidden=true;unsubO&&unsubO();unsubO=null;orders=[]}
});
const openAdm=()=>{$("adm").hidden=false;$("ab").hidden=true};
$("ab").onclick=openAdm;
$("aclose").onclick=()=>{$("adm").hidden=true;$("ab").hidden=false};
$("aout").onclick=()=>signOut(auth);
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("tp").hidden=b.dataset.t!=="p";$("to").hidden=b.dataset.t!=="o"});

/* mahsulotlar */
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};i.src=URL.createObjectURL(f)});
function plist(){
  $("plist").innerHTML=products.map(p=>`<div class="card pr">${pic(p)}<div><b>${esc(p.name)}</b><br><small>${som(p.price)}${p.available===false?" · sotuvda yo'q":""}</small></div><button class="sec" data-e="${p.id}">Tahrirlash</button><button class="sec" data-x="${p.id}">O'chirish</button></div>`).join("");
}
function clearForm(){editId=null;editImg="";["pn","pi","pp","pf","pd","pk","po"].forEach(i=>$(i).value="");$("pa").checked=true;$("ftitle").textContent="Yangi mahsulot";$("perr").textContent=""}
$("pc").onclick=clearForm;
$("ps").onclick=async()=>{
  const name=$("pn").value.trim(),price=Math.round(Number($("pp").value));
  if(!name||!(price>=0)||$("pp").value===""){$("perr").textContent="Nomi va narxini kiriting.";return}
  $("ps").disabled=true;
  try{
    const f=$("pf").files[0];if(f)editImg=await shrink(f);
    const data={name,info:$("pi").value.trim(),desc:$("pd").value.trim(),cat:$("pk").value.trim(),old:Math.round(Number($("po").value))||0,price,available:$("pa").checked,img:editImg};
    editId?await setDoc(doc(db,"products",editId),data):await addDoc(collection(db,"products"),data);
    clearForm();
  }catch(e){$("perr").textContent="Saqlanmadi. Qayta kirib ko'ring."}
  $("ps").disabled=false;
};
$("plist").onclick=async e=>{
  const x=e.target.closest("[data-x]"),ed=e.target.closest("[data-e]");
  if(x&&confirm("Mahsulot o'chirilsinmi?"))await deleteDoc(doc(db,"products",x.dataset.x));
  if(ed){const p=products.find(p=>p.id===ed.dataset.e);editId=p.id;editImg=p.img||"";$("pn").value=p.name;$("pi").value=p.info||"";$("pd").value=p.desc||"";$("pk").value=p.cat||"";$("po").value=p.old||"";$("pp").value=p.price;$("pa").checked=p.available!==false;$("pf").value="";$("ftitle").textContent="Tahrirlash: "+p.name;scrollTo(0,0);$("adm").scrollTo(0,0)}
};

/* buyurtmalar */
function olist(){
  const n=orders.filter(o=>o.status==="new").length;
  $("otab").textContent=n?`Buyurtmalar (${n} yangi)`:"Buyurtmalar";
  $("olist").innerHTML=orders.length?orders.map(o=>`<div class="card"><div class="row"><b>${esc(o.name)}</b><small>${o.createdAt?o.createdAt.toDate().toLocaleString("ru-RU"):""}</small></div>
    <div><b>${o.method==="pickup"?"Olib ketish":"Yetkazib berish"}</b><br><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.addr?"<br>"+esc(o.addr):""}${o.note?"<br><i>"+esc(o.note)+"</i>":""}</div>
    ${(o.items||[]).map(i=>`<div class="row"><span>${esc(i.n)} × ${esc(i.q)}</span><span>${som(i.p*i.q)}</span></div>`).join("")}
    <div class="row"><b>Jami</b><b>${som(o.total)}</b></div>
    <label>Holati<select data-s="${o.id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v}</option>`).join("")}</select></label>
    <div class="acts"><button class="sec" data-od="${o.id}">O'chirish</button></div></div>`).join(""):"<p>Hozircha buyurtmalar yo'q.</p>";
}
$("olist").onchange=e=>{const s=e.target.closest("[data-s]");s&&updateDoc(doc(db,"orders",s.dataset.s),{status:s.value})};
$("olist").onclick=e=>{const d=e.target.closest("[data-od]");d&&confirm("Buyurtma o'chirilsinmi?")&&deleteDoc(doc(db,"orders",d.dataset.od))};
</script>
